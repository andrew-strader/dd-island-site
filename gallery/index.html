<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DD Island — Gallery</title>
<meta name="description" content="DD Island photo gallery" />
<style>
  :root{
    --bg:#111;
    --ink:#ccffdd;
    --muted:#99ccaa;
    --rule:#2a2a2a;
    --link:#b3ffcc;
    --maxw:1100px;
  }

  html,body{height:100%}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:"Helvetica Neue", Helvetica, Arial, sans-serif;
    line-height:1.6;
    font-size:17px;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
  }

  a{color:var(--link);text-decoration:none}
  a:hover{text-decoration:underline}

  header{border-bottom:1px solid var(--rule)}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:28px 20px}

  nav{
    display:flex;
    gap:18px;
    flex-wrap:wrap;
    align-items:baseline;
    justify-content:space-between;
  }
  .brand{font-size:22px;letter-spacing:.5px}
  .nav-links{display:flex;gap:14px;align-items:center}
  .nav-links a{opacity:.9}

  .topline{
    display:flex;
    gap:14px;
    flex-wrap:wrap;
    align-items:baseline;
    justify-content:space-between;
    margin-top:18px;
    padding-top:18px;
    border-top:1px solid var(--rule);
  }

  .credit{color:var(--muted); font-size:13px}

  /* Gallery grid (varied sizes) */
  .grid{
    margin-top:22px;
    display:grid;
    gap:14px;
    grid-template-columns: repeat(12, 1fr);
    grid-auto-rows: 12px; /* small row height -> “masonry-ish” */
  }

  .tile{
    position:relative;
    border:1px solid var(--rule);
    background:#0a0a0a;
    overflow:hidden;
    border-radius:10px;
  }
  .tile img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    filter: grayscale(25%);
    transition: transform .25s ease, filter .25s ease, opacity .25s ease;
    opacity:.95;
  }
  .tile:hover img{
    transform: scale(1.03);
    filter: grayscale(0%);
    opacity:1;
  }

  /* “Various sizes” via spans */
  .w6{grid-column: span 6;}
  .w7{grid-column: span 7;}
  .w5{grid-column: span 5;}
  .w4{grid-column: span 4;}
  .w8{grid-column: span 8;}
  .h22{grid-row: span 22;}
  .h28{grid-row: span 28;}
  .h34{grid-row: span 34;}
  .h40{grid-row: span 40;}

  /* Lightbox */
  .lightbox{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.85);
    display:none;
    align-items:center;
    justify-content:center;
    padding:24px;
    z-index:999;
  }
  .lightbox.open{display:flex;}
  .lightbox-inner{
    max-width:min(1100px, 96vw);
    max-height:92vh;
    width:100%;
    border:1px solid var(--rule);
    background:#0a0a0a;
    border-radius:12px;
    overflow:hidden;
  }
  .lightbox-inner img{
    width:100%;
    height:auto;
    display:block;
  }
  .lb-bar{
    display:flex;
    justify-content:space-between;
    gap:12px;
    padding:10px 12px;
    border-top:1px solid var(--rule);
    color:var(--muted);
    font-size:13px;
  }
  .lb-btn{
    border:1px solid var(--rule);
    background:transparent;
    color:var(--ink);
    padding:6px 10px;
    border-radius:8px;
    cursor:pointer;
  }
  .lb-btn:hover{background:#151515}

  @media (max-width: 900px){
    .grid{grid-template-columns: repeat(6, 1fr);}
    .w8,.w7,.w6{grid-column: span 6;}
    .w5,.w4{grid-column: span 6;}
  }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <nav>
      <div class="brand">DD Island</div>
      <div class="nav-links">
        <a href="/">Home</a>
        <a href="/#shows">Shows</a>
        <a href="/#merch">Merch</a>
        <a href="/#contact">Contact</a>
      </div>
    </nav>

    <div class="topline">
      <div>
        <h1 style="margin:0;font-size:20px;font-weight:600;letter-spacing:.2px;">Gallery</h1>
        <div class="credit">All photos © Kristin Sollecito</div>
      </div>
      <div class="credit">Click an image to view larger.</div>
    </div>

    <div class="grid" id="grid">
      <!-- NOTE: your filenames include spaces/parentheses — these are URL-encoded below -->
      <a class="tile w7 h40" href="/gallery/0010_28.jpg" data-full="/gallery/0010_28.jpg">
        <img src="/gallery/0010_28.jpg" alt="DD Island photo — Kristin Sollecito">
      </a>

      <a class="tile w5 h28" href="/gallery/0036_2%20copy.jpg" data-full="/gallery/0036_2%20copy.jpg">
        <img src="/gallery/0036_2%20copy.jpg" alt="DD Island photo — Kristin Sollecito">
      </a>

      <a class="tile w6 h34" href="/gallery/0019_19%20copy%20(1).jpg" data-full="/gallery/0019_19%20copy%20(1).jpg">
        <img src="/gallery/0019_19%20copy%20(1).jpg" alt="DD Island photo — Kristin Sollecito">
      </a>

      <a class="tile w6 h22" href="/gallery/IMG_2243.JPG.jpeg" data-full="/gallery/IMG_2243.JPG.jpeg">
        <img src="/gallery/IMG_2243.JPG.jpeg" alt="DD Island photo — Kristin Sollecito">
      </a>
    </div>
  </div>
</header>

<!-- Lightbox -->
<div class="lightbox" id="lightbox" aria-hidden="true">
  <div class="lightbox-inner">
    <img id="lbImg" src="" alt="Expanded gallery image">
    <div class="lb-bar">
      <div>All photos © Kristin Sollecito</div>
      <div>
        <button class="lb-btn" id="lbClose" type="button">Close</button>
      </div>
    </div>
  </div>
</div>

<script>
  // Simple lightbox: click any tile opens image
  const lb = document.getElementById('lightbox');
  const lbImg = document.getElementById('lbImg');
  const lbClose = document.getElementById('lbClose');

  document.getElementById('grid').addEventListener('click', (e) => {
    const a = e.target.closest('a[data-full]');
    if(!a) return;
    e.preventDefault();
    lbImg.src = a.getAttribute('data-full');
    lb.classList.add('open');
    lb.setAttribute('aria-hidden', 'false');
  });

  function closeLB(){
    lb.classList.remove('open');
    lb.setAttribute('aria-hidden', 'true');
    lbImg.src = '';
  }

  lbClose.addEventListener('click', closeLB);
  lb.addEventListener('click', (e)=>{ if(e.target === lb) closeLB(); });
  window.addEventListener('keydown', (e)=>{ if(e.key === 'Escape') closeLB(); });
</script>

</body>
</html>
