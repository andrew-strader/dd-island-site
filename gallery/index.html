<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DD Island — Gallery</title>
<meta name="description" content="DD Island photo gallery." />

<style>
:root{
  --bg:#111;
  --ink:#ccffdd;
  --muted:#99ccaa;
  --rule:#2a2a2a;
  --link:#b3ffcc;
  --maxw:1200px;
}

html,body{height:100%}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:"Helvetica Neue", Helvetica, Arial, sans-serif;
  line-height:1.6;
  font-size:17px;
}

a{color:var(--link);text-decoration:none}
a:hover{text-decoration:underline}

header{
  border-bottom:1px solid var(--rule);
}
.wrap{
  max-width:var(--maxw);
  margin:0 auto;
  padding:28px 20px;
}

nav{
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.brand{
  font-size:22px;
  letter-spacing:.5px;
}
.nav-links{
  display:flex;
  gap:16px;
}
.nav-links a{opacity:.9}

h1{
  font-size:22px;
  margin:0 0 18px;
}

/* ===== Gallery Grid ===== */
.gallery{
  display:grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap:22px;
}

.figure{
  display:flex;
  flex-direction:column;
  gap:6px;
}

.figure button{
  padding:0;
  border:none;
  background:none;
  cursor:pointer;
}

.figure img{
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;
  border-radius:14px;
  border:1px solid var(--rule);
  transition: transform .25s ease, opacity .25s ease;
}

.figure img:hover{
  transform:scale(1.02);
  opacity:.9;
}

.caption{
  font-size:13px;
  color:var(--muted);
  padding-left:2px;
}

/* Variable sizing */
.tall{ grid-row: span 2; }
.wide{ grid-column: span 2; }

/* ===== Lightbox ===== */
.lightbox{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.8);
  display:none;
  z-index:9999;
  align-items:center;
  justify-content:center;
  padding:24px;
}
.lightbox.is-open{ display:flex; }

.lightbox__frame{
  width:min(1100px,96vw);
  height:92vh;
  display:flex;
  align-items:center;
  justify-content:center;
}

.lightbox__img{
  width:100%;
  height:100%;
  object-fit:contain;
  background:#000;
  border-radius:14px;
  border:1px solid rgba(255,255,255,.2);
}

.lightbox__close{
  position:fixed;
  top:18px;
  right:18px;
  background:rgba(17,17,17,.7);
  color:var(--ink);
  border:1px solid rgba(204,255,221,.5);
  border-radius:10px;
  padding:10px 12px;
  cursor:pointer;
}
.lightbox__close:hover{
  background:rgba(21,21,21,.9);
}

body.no-scroll{ overflow:hidden; }

footer{
  border-top:1px solid var(--rule);
  margin-top:60px;
}
.small{
  font-size:13px;
  color:var(--muted);
}
</style>
</head>

<body>

<header>
  <div class="wrap">
    <nav>
      <div class="brand"><a href="/">DD Island</a></div>
      <div class="nav-links small">
        <a href="/">Home</a>
        <a href="/#shows">Shows</a>
        <a href="/#merch">Merch</a>
        <a href="/#contact">Contact</a>
      </div>
    </nav>
  </div>
</header>

<main>
  <div class="wrap">
    <h1>Gallery</h1>

    <div class="gallery" id="gallery">

      <div class="figure tall">
        <button data-src="/gallery/0010_28.jpg">
          <img src="/gallery/0010_28.jpg" alt="DD Island photo">
        </button>
        <div class="caption">Photo: Kristin Sollecito</div>
      </div>

      <div class="figure">
        <button data-src="/gallery/0019_19 copy (1).jpg">
          <img src="/gallery/0019_19 copy (1).jpg" alt="DD Island photo">
        </button>
        <div class="caption">Photo: Kristin Sollecito</div>
      </div>

      <div class="figure wide">
        <button data-src="/gallery/0036_2 copy.jpg">
          <img src="/gallery/0036_2 copy.jpg" alt="DD Island photo">
        </button>
        <div class="caption">Photo: Kristin Sollecito</div>
      </div>

      <div class="figure tall">
        <button data-src="/gallery/IMG_2243.JPG.jpeg">
          <img src="/gallery/IMG_2243.JPG.jpeg" alt="DD Island photo">
        </button>
        <div class="caption">Photo: Kristin Sollecito</div>
      </div>

    </div>
  </div>
</main>

<footer>
  <div class="wrap">
    <p class="small">© <span id="year"></span> DD Island</p>
  </div>
</footer>

<!-- Lightbox -->
<div class="lightbox" id="lightbox" aria-hidden="true">
  <button class="lightbox__close" id="lbClose">Close</button>
  <div class="lightbox__frame">
    <img class="lightbox__img" id="lbImg" alt="">
  </div>
</div>

<script>
document.getElementById('year').textContent = new Date().getFullYear();

const lb = document.getElementById('lightbox');
const lbImg = document.getElementById('lbImg');
const lbClose = document.getElementById('lbClose');

function openLightbox(src){
  lbImg.src = src;
  lb.classList.add('is-open');
  document.body.classList.add('no-scroll');
}

function closeLightbox(){
  lb.classList.remove('is-open');
  document.body.classList.remove('no-scroll');
  lbImg.src = '';
}

document.getElementById('gallery').addEventListener('click', e=>{
  const btn = e.target.closest('button[data-src]');
  if(btn) openLightbox(btn.dataset.src);
});

lbClose.addEventListener('click', closeLightbox);
lb.addEventListener('click', e=>{
  if(e.target === lb) closeLightbox();
});
window.addEventListener('keydown', e=>{
  if(e.key === 'Escape') closeLightbox();
});
</script>

</body>
</html>
