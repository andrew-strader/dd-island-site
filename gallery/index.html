<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DD Island — Gallery</title>
<meta name="description" content="DD Island photo gallery" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cutive+Mono&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#111;
    --ink:#ccffdd;
    --muted:#99ccaa;
    --rule:#2a2a2a;
    --link:#b3ffcc;
    --maxw:1700px;  /* BIGGER container */
  }

  html,body{height:100%}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:"Cutive Mono", "Courier New", monospace;
    line-height:1.6;
    font-size:17px;
  }

  /* 8-bit starry background */
  .stars{
    position:fixed;
    top:0;left:0;right:0;bottom:0;
    pointer-events:none;
    z-index:-1;
    overflow:hidden;
  }
  .star{
    position:absolute;
    font-size:10px;
    line-height:1;
    animation:spinflare 4s ease-in-out infinite;
  }
  @keyframes spinflare{
    0%{opacity:0.3;transform:rotate(0deg) scale(0.8)}
    50%{opacity:1;transform:rotate(180deg) scale(1.3)}
    100%{opacity:0.3;transform:rotate(360deg) scale(0.8)}
  }

  a{color:var(--link);text-decoration:none}
  a:hover{text-decoration:underline}

  header{border-bottom:1px solid var(--rule)}
  footer{border-top:1px solid var(--rule);margin-top:24px}

  .wrap{
    max-width:var(--maxw);
    margin:0 auto;
    padding:22px 20px; /* slightly tighter to feel bigger */
  }

  nav{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap:18px;
    flex-wrap:wrap;
  }

  .brand{
    font-size:22px;
    letter-spacing:.5px;
    font-weight:700;
  }

  .nav-links{
    display:flex;
    gap:14px;
    align-items:center;
    font-size:13px;
  }

  .nav-links a{opacity:.9;font-weight:700}
  .social-icon{display:flex;align-items:center}
  .social-icon:hover{opacity:1}
  .nav-links a.active{
    font-weight:700;
    opacity:1;
  }

  h1{
    font-size:22px;
    font-weight:600;
    margin:0 0 18px;
  }

  /* Gallery grid: bigger tiles */
  .gallery{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(420px, 1fr)); /* bigger minimum */
    gap:26px;
  }

  .gallery-item{
    display:flex;
    flex-direction:column;
    gap:10px;
  }

  .thumb{
    width:100%;
    aspect-ratio:16 / 9; /* a bit taller than 3/2 in feel */
    border-radius:12px;
    overflow:hidden;
    background:#000;
    cursor:pointer;
    box-shadow:0 10px 30px rgba(0,0,0,.35);
  }

  .thumb img{
    width:100%;
    height:100%;
    object-fit:cover;
    transition:transform .25s ease;
  }

  .thumb:hover img{
    transform:scale(1.03);
  }

  .caption{
    font-size:13px;
    color:var(--muted);
  }

  /* Lightbox */
  .lightbox{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.92);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:1000;
    padding:24px;
  }

  .lightbox.active{display:flex}

  .lightbox img{
    max-width:92vw;
    max-height:86vh;
    object-fit:contain;
    border-radius:10px;
  }

  .lightbox-close{
    position:absolute;
    top:18px;
    right:22px;
    font-size:28px;
    color:var(--ink);
    cursor:pointer;
    opacity:.85;
    user-select:none;
  }
  .lightbox-close:hover{opacity:1}

  /* Side arrows */
  .lb-arrow{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    width:46px;
    height:46px;
    border-radius:999px;
    border:1px solid rgba(204,255,221,.35);
    background:rgba(0,0,0,.35);
    color:var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:26px;
    cursor:pointer;
    opacity:.9;
    user-select:none;
  }
  .lb-arrow:hover{background:rgba(0,0,0,.55)}
  .lb-prev{left:18px}
  .lb-next{right:18px}

  /* Hide arrows on very small screens (still works with swipe/keys) */
  @media (max-width:520px){
    .lb-arrow{display:none}
    .gallery{grid-template-columns:1fr}
    .thumb{aspect-ratio:4/3}
  }

  .small{
    font-size:13px;
    color:var(--muted);
  }
</style>
</head>

<body>

<div class="stars"></div>

<header>
  <div class="wrap">
    <nav>
      <div class="brand">
  <a href="/" style="color:inherit; text-decoration:none;">DD Island</a>
</div>
      <div class="nav-links">
        <a href="/">About</a>
        <a href="/#music">Music</a>
        <a href="/#shows">Shows</a>
        <a href="/#merch">Merch</a>
        <a href="/#contact">Contact</a>
        <a href="/gallery/" class="active">Gallery</a>
        <a href="https://www.instagram.com/dd.island/?hl=en" target="_blank" rel="noopener" aria-label="Instagram" class="social-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
            <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
            <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
          </svg>
        </a>
      </div>
    </nav>
  </div>
</header>

<main>
  <div class="wrap">
    <h1>Gallery</h1>

    <div class="gallery">

      <div class="gallery-item">
        <div class="thumb" data-full="/gallery/0010_28.jpg">
          <img src="/gallery/0010_28.jpg" alt="DD Island photo">
        </div>
        <div class="caption">Photo: Kristin Sollecito</div>
      </div>

      <div class="gallery-item">
        <div class="thumb" data-full="/gallery/0019_19 copy (1).jpg">
          <img src="/gallery/0019_19 copy (1).jpg" alt="DD Island photo">
        </div>
        <div class="caption">Photo: Kristin Sollecito</div>
      </div>

      <div class="gallery-item">
        <div class="thumb" data-full="/gallery/0036_2 copy.jpg">
          <img src="/gallery/0036_2 copy.jpg" alt="DD Island photo">
        </div>
        <div class="caption">Photo: Kristin Sollecito</div>
      </div>

      <div class="gallery-item">
        <div class="thumb" data-full="/gallery/IMG_2243.JPG.jpeg">
          <img src="/gallery/IMG_2243.JPG.jpeg" alt="DD Island photo">
        </div>
        <div class="caption">Photo: Kristin Sollecito</div>
      </div>

     <div class="gallery-item">
  <div class="thumb" data-full="/gallery/0008_30.jpg">
    <img src="/gallery/0008_30.jpg" alt="DD Island photo">
  </div>
  <div class="caption">Photo: Kristin Sollecito</div>
</div>

<div class="gallery-item">
  <div class="thumb" data-full="/gallery/0027_11.jpg">
    <img src="/gallery/0027_11.jpg" alt="DD Island photo">
  </div>
  <div class="caption">Photo: Kristin Sollecito</div>
</div>

    </div>
  </div>
</main>

<footer>
  <div class="wrap">
    <p class="small">© <span id="year"></span> DD Island</p>
  </div>
</footer>

<!-- Lightbox -->
<div class="lightbox" id="lightbox" aria-hidden="true">
  <div class="lb-arrow lb-prev" id="lbPrev" aria-label="Previous photo">‹</div>
  <img id="lightboxImg" alt="">
  <div class="lb-arrow lb-next" id="lbNext" aria-label="Next photo">›</div>
  <div class="lightbox-close" id="lightboxClose" aria-label="Close">×</div>
</div>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();

  // Generate spinning asterisk stars
  (function(){
    var container = document.querySelector('.stars');
    var colors = ['#ccffdd', '#99ccaa', '#b3ffcc'];
    var starCount = 60;
    for(var i = 0; i < starCount; i++){
      var star = document.createElement('span');
      star.className = 'star';
      star.textContent = '*';
      star.style.left = Math.random() * 100 + 'vw';
      star.style.top = Math.random() * 100 + 'vh';
      star.style.color = colors[Math.floor(Math.random() * colors.length)];
      star.style.fontSize = (8 + Math.random() * 8) + 'px';
      star.style.animationDelay = (Math.random() * 4) + 's';
      star.style.animationDuration = (3 + Math.random() * 4) + 's';
      container.appendChild(star);
    }
  })();

  const thumbs = Array.from(document.querySelectorAll('.thumb'));
  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightboxImg');
  const closeBtn = document.getElementById('lightboxClose');
  const prevBtn = document.getElementById('lbPrev');
  const nextBtn = document.getElementById('lbNext');

  let currentIndex = 0;

  function openAt(index){
    currentIndex = (index + thumbs.length) % thumbs.length;
    lightboxImg.src = thumbs[currentIndex].dataset.full;
    lightbox.classList.add('active');
    document.body.style.overflow = 'hidden'; // prevent page scroll behind modal
  }

  function closeLightbox(){
    lightbox.classList.remove('active');
    lightboxImg.src = '';
    document.body.style.overflow = '';
  }

  function next(){
    openAt(currentIndex + 1);
  }

  function prev(){
    openAt(currentIndex - 1);
  }

  thumbs.forEach((t, i) => {
    t.addEventListener('click', () => openAt(i));
  });

  closeBtn.addEventListener('click', closeLightbox);
  nextBtn.addEventListener('click', next);
  prevBtn.addEventListener('click', prev);

  // click outside image closes
  lightbox.addEventListener('click', (e) => {
    const clickedArrow = e.target === nextBtn || e.target === prevBtn;
    const clickedImage = e.target === lightboxImg;
    const clickedClose = e.target === closeBtn;
    if (!clickedArrow && !clickedImage && !clickedClose) closeLightbox();
  });

  // keyboard controls
  window.addEventListener('keydown', (e) => {
    if (!lightbox.classList.contains('active')) return;
    if (e.key === 'Escape') closeLightbox();
    if (e.key === 'ArrowRight') next();
    if (e.key === 'ArrowLeft') prev();
  });

  // simple swipe support (mobile)
  let touchStartX = null;
  lightbox.addEventListener('touchstart', (e) => {
    if (!e.touches || !e.touches[0]) return;
    touchStartX = e.touches[0].clientX;
  }, {passive:true});

  lightbox.addEventListener('touchend', (e) => {
    if (touchStartX === null) return;
    const endX = (e.changedTouches && e.changedTouches[0]) ? e.changedTouches[0].clientX : null;
    if (endX === null) return;
    const dx = endX - touchStartX;
    touchStartX = null;
    if (Math.abs(dx) < 40) return;
    if (dx < 0) next();
    else prev();
  }, {passive:true});
</script>

</body>
</html>
