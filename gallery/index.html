<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DD Island — Gallery</title>
<meta name="description" content="DD Island photo gallery" />

<style>
  :root{
    --bg:#111;
    --ink:#ccffdd;
    --muted:#99ccaa;
    --rule:#2a2a2a;
    --link:#b3ffcc;
    --maxw:1400px;
  }

  html,body{height:100%}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:"Helvetica Neue", Helvetica, Arial, sans-serif;
    line-height:1.6;
    font-size:17px;
  }

  a{color:var(--link);text-decoration:none}
  a:hover{text-decoration:underline}

  header{border-bottom:1px solid var(--rule)}
  footer{border-top:1px solid var(--rule);margin-top:32px}

  .wrap{
    max-width:var(--maxw);
    margin:0 auto;
    padding:28px 20px;
  }

  nav{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap:18px;
    flex-wrap:wrap;
  }

  .brand{
    font-size:22px;
    letter-spacing:.5px;
  }

  .nav-links{
    display:flex;
    gap:14px;
    align-items:center;
    font-size:13px;
  }

  .nav-links a{opacity:.9}
  .nav-links a.active{
    font-weight:600;
    opacity:1;
  }

  h1{
    font-size:22px;
    font-weight:600;
    margin:0 0 24px;
  }

  /* Gallery grid */
  .gallery{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(320px, 1fr));
    gap:24px;
  }

  .gallery-item{
    display:flex;
    flex-direction:column;
    gap:8px;
  }

  .thumb{
    width:100%;
    aspect-ratio:3 / 2;
    border-radius:10px;
    overflow:hidden;
    background:#000;
    cursor:pointer;
  }

  .thumb img{
    width:100%;
    height:100%;
    object-fit:cover;
    transition:transform .3s ease;
  }

  .thumb:hover img{
    transform:scale(1.03);
  }

  .caption{
    font-size:13px;
    color:var(--muted);
  }

  /* Lightbox */
  .lightbox{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.92);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:1000;
    padding:20px;
  }

  .lightbox img{
    max-width:100%;
    max-height:100%;
    object-fit:contain;
  }

  .lightbox.active{display:flex}

  .lightbox-close{
    position:absolute;
    top:20px;
    right:24px;
    font-size:26px;
    color:var(--ink);
    cursor:pointer;
    opacity:.8;
  }

  .lightbox-close:hover{opacity:1}

  .small{
    font-size:13px;
    color:var(--muted);
  }
</style>
</head>

<body>

<header>
  <div class="wrap">
    <nav>
      <div class="brand">DD Island</div>
      <div class="nav-links">
        <a href="/">About</a>
        <a href="/#music">Music</a>
        <a href="/#shows">Shows</a>
        <a href="/#merch">Merch</a>
        <a href="/#contact">Contact</a>
        <a href="/gallery/" class="active">Gallery</a>
      </div>
    </nav>
  </div>
</header>

<main>
  <div class="wrap">
    <h1>Gallery</h1>

    <div class="gallery">

      <div class="gallery-item">
        <div class="thumb" data-full="/gallery/0010_28.jpg">
          <img src="/gallery/0010_28.jpg" alt="DD Island photo">
        </div>
        <div class="caption">Photo: Kristin Sollecito</div>
      </div>

      <div class="gallery-item">
        <div class="thumb" data-full="/gallery/0019_19 copy (1).jpg">
          <img src="/gallery/0019_19 copy (1).jpg" alt="DD Island photo">
        </div>
        <div class="caption">Photo: Kristin Sollecito</div>
      </div>

      <div class="gallery-item">
        <div class="thumb" data-full="/gallery/0036_2 copy.jpg">
          <img src="/gallery/0036_2 copy.jpg" alt="DD Island photo">
        </div>
        <div class="caption">Photo: Kristin Sollecito</div>
      </div>

      <div class="gallery-item">
        <div class="thumb" data-full="/gallery/IMG_2243.JPG.jpeg">
          <img src="/gallery/IMG_2243.JPG.jpeg" alt="DD Island photo">
        </div>
        <div class="caption">Photo: Kristin Sollecito</div>
      </div>

    </div>
  </div>
</main>

<footer>
  <div class="wrap">
    <p class="small">© <span id="year"></span> DD Island</p>
  </div>
</footer>

<!-- Lightbox -->
<div class="lightbox" id="lightbox">
  <span class="lightbox-close" id="lightboxClose">×</span>
  <img id="lightboxImg" alt="">
</div>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();

  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightboxImg');
  const closeBtn = document.getElementById('lightboxClose');

  document.querySelectorAll('.thumb').forEach(t => {
    t.addEventListener('click', () => {
      lightboxImg.src = t.dataset.full;
      lightbox.classList.add('active');
    });
  });

  closeBtn.addEventListener('click', () => {
    lightbox.classList.remove('active');
    lightboxImg.src = '';
  });

  lightbox.addEventListener('click', e => {
    if(e.target === lightbox){
      lightbox.classList.remove('active');
      lightboxImg.src = '';
    }
  });
</script>

</body>
</html>
